name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      OTP_PEPPER_SECRET: ci-otp-pepper-secret-that-is-at-least-32-characters
      EMAIL_PROVIDER: gmail
      EMAIL_FROM: ci@example.com
      GMAIL_APP_PASSWORD: dummy-gmail-app-password
      ALLOWED_ORIGINS: http://localhost:3000
      USE_REDIS: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint:check

      - name: Format check
        run: bun run prettier:check

      - name: Test
        run: bun run test
