name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_ACCESS_EXPIRES_IN: '15m'
      OTP_PEPPER_SECRET: ci-otp-pepper-secret-that-is-at-least-32-characters
      EMAIL_PROVIDER: gmail
      EMAIL_FROM: ci@example.com
      GMAIL_APP_PASSWORD: dummy-gmail-app-password
      ALLOWED_ORIGINS: http://localhost:3000
      USE_REDIS: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint:check

      - name: Format check
        run: bun run prettier:check

      - name: Test with coverage
        run: bun run test:coverage

      - name: Dependency audit
        # Report known advisories without failing the build until a triage
        # policy (severity threshold) is agreed.
        run: bun audit
        continue-on-error: true

  # Workflow YAML is deliberately outside `verify`, which only typechecks and
  # tests application code. GitHub refuses to schedule ANY job from an invalid
  # workflow file, so the run turns red in under a second with zero jobs and no
  # log to read — that is how a misplaced `script:` key went unnoticed for two
  # days. actionlint also picks up the runner's shellcheck and lints the shell
  # inside every `run:` block.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        env:
          # Bump when releasing; dependabot only tracks `uses:` references, not
          # pinned binaries downloaded in a `run:` step.
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tgz -C /tmp
          rm /tmp/actionlint.tgz
          /tmp/actionlint --version

      - name: Lint workflow files
        run: /tmp/actionlint -color

  # The Dockerfile has no coverage in `verify` either: commit bab51d0 shipped a
  # COPY that omitted src/config/database-url.ts, which broke `prisma generate`
  # in the builder stage, and no CI job noticed until a deploy failed. Both
  # published targets are built here — `runner` is also the default target, so
  # building it covers what `docker build .` produces.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build --target runner --tag taskflow:runner .

      - name: Build migration image
        run: docker build --target migrate --tag taskflow:migrate .
