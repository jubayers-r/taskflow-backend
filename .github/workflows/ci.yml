name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskflow_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret
      OTP_PEPPER_SECRET: ci-otp-pepper-secret-that-is-at-least-32-characters
      EMAIL_PROVIDER: gmail
      EMAIL_FROM: ci@example.com
      GMAIL_APP_PASSWORD: dummy-gmail-app-password
      ALLOWED_ORIGINS: http://localhost:3000
      USE_REDIS: 'false'

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint:check

      - name: Format check
        run: bun run prettier:check

      - name: Test with coverage
        run: bun run test:coverage

      - name: Dependency audit
        # Report known advisories without failing the build until a triage
        # policy (severity threshold) is agreed.
        run: bun audit
        continue-on-error: true
