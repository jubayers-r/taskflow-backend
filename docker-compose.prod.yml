# Production stack. Run with:
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d
#
# `--env-file` is required because this file interpolates ${...} placeholders;
# those same secrets are injected into the app/migrate containers as env vars.
#
# Optional self-hosted uptime monitoring:
#
#   docker compose --env-file .env.production \
#     -f docker-compose.prod.yml --profile monitoring up -d
name: taskflow-prod

services:
  # --- Redis ---
  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a $$REDIS_PASSWORD ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &json-logs
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

  # --- PostgreSQL ---
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *json-logs

  # --- One-shot schema migration ---
  migrate:
    build:
      context: .
      target: migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logs

  # --- API ---
  app:
    build:
      context: .
      target: runner
    restart: always
    environment:
      NODE_ENV: production
      PROJECT_NAME: ${PROJECT_NAME:-taskflow-backend}
      PORT: '5000'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      USE_REDIS: 'true'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      OTP_PEPPER_SECRET: ${OTP_PEPPER_SECRET:?OTP_PEPPER_SECRET is required}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5000/health/ready']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *json-logs

  # --- Nightly PostgreSQL backup (retention-aware pg_dump) ---
  # Backs up into a named volume. Copy that volume offsite (S3/R2) for true
  # durability — a backup on the same machine is not a backup.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: '0 2 * * *'
      BACKUP_KEEP_DAYS: '14'
      BACKUP_KEEP_WEEKS: '4'
      BACKUP_KEEP_MONTHS: '3'
      BACKUP_CLEANUP_PRIORITY: 'yes'
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *json-logs

  # --- Self-hosted uptime monitoring (optional: --profile monitoring) ---
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: always
    profiles: ['monitoring']
    ports:
      - '3001:3001'
    volumes:
      - uptime_kuma_data:/app/data
    logging: *json-logs

volumes:
  redis_data:
  postgres_data:
  backup_data:
  uptime_kuma_data:
