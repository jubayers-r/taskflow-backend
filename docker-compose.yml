services:
  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    env_file:
      - .env
    command: sh -c "redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'sh', '-c', 'redis-cli -a $$REDIS_PASSWORD ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Postgres DB ---
  postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taskflow_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # --- One-shot schema migration (runs before the app starts) ---
  migrate:
    build: .
    restart: 'no'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow_db?schema=public
    command: ['bunx', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  # --- API ---
  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      # Inside the compose network the datastores are reached by service name.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskflow_db?schema=public
      REDIS_HOST: redis
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  redis_data:
  postgres_data:
